[project]
name = "memory-algebra"
version = "0.1.0"
description = "Fundamentação, Computação e Validação da Álgebra da Memória"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6",
]
diff = [
    "jax>=0.4",
]

[tool.setuptools]
packages = ["memory_algebra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
